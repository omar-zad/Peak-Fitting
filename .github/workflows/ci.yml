name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  reference-run:
    name: reference run (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Report resolved versions
        run: python -c "import numpy,pandas,scipy,matplotlib;print('numpy',numpy.__version__,'pandas',pandas.__version__,'scipy',scipy.__version__,'matplotlib',matplotlib.__version__)"

      - name: Run the reference-run regression test
        run: pytest -v
